<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#196f3d"/>
      <stop offset="100%" stop-color="#145a32"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Tall Glass -->
            <path d="M-22,-35 L22,-35 L16,35 L-16,35 Z" fill="none" stroke="#d5f5e3" stroke-width="3"/>
            <path d="M-20,-30 L20,-30 L15,32 L-15,32 Z" fill="#e8f8f5" opacity="0.8"/>
            <!-- Bubbles & Lime Slice -->
            <circle cx="0" cy="5" r="3" fill="#a3e4d7"/>
            <circle cx="-6" cy="-15" r="2.5" fill="#a3e4d7"/>
            <circle cx="8" cy="-5" r="2" fill="#a3e4d7"/>
            <circle cx="16" cy="-35" r="12" fill="#f4d03f"/>
            <!-- Straw -->
            <line x1="-8" y1="30" x2="15" y2="-55" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Fresh Lime 7Up</text>
  </g>
</svg>