<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a085"/>
      <stop offset="100%" stop-color="#0e6655"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <path d="M-38,20 C-45,-15 -25,-30 0,-30 C25,-30 45,-15 38,20 C32,28 -32,28 -38,20 Z" fill="#b9770e"/>
            <ellipse cx="0" cy="-28" rx="30" ry="12" fill="#d68910"/>
            <ellipse cx="0" cy="-29" rx="25" ry="9" fill="#fcf3cf"/>
            <!-- Paneer Cubes -->
            <rect x="-14" y="-33" width="8" height="6" rx="1" fill="#ffffff" stroke="#f9e79f" stroke-width="1"/>
            <rect x="4" y="-32" width="7" height="6" rx="1" fill="#ffffff" stroke="#f9e79f" stroke-width="1"/>
            <rect x="-4" y="-28" width="8" height="5" rx="1" fill="#ffffff" stroke="#f9e79f" stroke-width="1"/>
            <circle cx="-5" cy="-30" r="1.5" fill="#e74c3c"/>
            <circle cx="8" cy="-27" r="1.5" fill="#27ae60"/>
            <path d="M-38,2 C-20,12 20,12 38,2" fill="none" stroke="#7e5109" stroke-width="3"/>
            <path d="M0,-42 Q4,-54 0,-64" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#fcf3cf" text-anchor="middle" letter-spacing="0.3">Paneer Reshmi Handi</text>
  </g>
</svg>