<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#117864"/>
      <stop offset="100%" stop-color="#0e6251"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Fish Steak pieces -->
            <path d="M-30,-15 C-15,-30 15,-30 30,-15 C15,0 -15,0 -30,-15 Z" fill="#e67e22"/>
            <path d="M-30,5 C-15,-10 15,-10 30,5 C15,20 -15,20 -30,5 Z" fill="#d35400"/>
            <line x1="-15" y1="-20" x2="-5" y2="-10" stroke="#935116" stroke-width="3"/>
            <line x1="5" y1="-20" x2="15" y2="-10" stroke="#935116" stroke-width="3"/>
            <line x1="-15" y1="0" x2="-5" y2="10" stroke="#935116" stroke-width="3"/>
            <line x1="5" y1="0" x2="15" y2="10" stroke="#935116" stroke-width="3"/>
            <!-- Lemon & Parsley -->
            <circle cx="-35" cy="0" r="10" fill="#f4d03f"/>
            <circle cx="35" cy="0" r="5" fill="#27ae60"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Grilled Fish Tikka</text>
  </g>
</svg>