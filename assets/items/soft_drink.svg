<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#922b21"/>
      <stop offset="100%" stop-color="#641e16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Beverage Can -->
            <rect x="-24" y="-30" width="48" height="65" rx="8" fill="#c0392b"/>
            <ellipse cx="0" cy="-30" rx="24" ry="7" fill="#bdc3c7"/>
            <ellipse cx="0" cy="35" rx="24" ry="7" fill="#95a5a6"/>
            <!-- Can Ring Pull -->
            <ellipse cx="0" cy="-30" rx="6" ry="3" fill="#7f8c8d"/>
            <!-- Stripe on can -->
            <path d="M-24,-5 Q0,-15 24,-5 L24,10 Q0,0 -24,10 Z" fill="#ffffff"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Soft Drink (Can)</text>
  </g>
</svg>