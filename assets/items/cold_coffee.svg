<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#512e10"/>
      <stop offset="100%" stop-color="#2e1906"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <path d="M-24,-25 L24,-25 L16,35 L-16,35 Z" fill="none" stroke="#ebedef" stroke-width="3"/>
            <path d="M-22,-20 L22,-20 L15,32 L-15,32 Z" fill="#784212"/>
            <!-- Vanilla Ice cream scoop -->
            <circle cx="0" cy="-25" r="18" fill="#fdfefe"/>
            <!-- Chocolate drizzle -->
            <path d="M-10,-28 Q0,-20 10,-28" stroke="#4a235a" stroke-width="2.5" fill="none"/>
            <line x1="4" y1="20" x2="22" y2="-55" stroke="#e67e22" stroke-width="4" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Cold Coffee with Ice Cream</text>
  </g>
</svg>