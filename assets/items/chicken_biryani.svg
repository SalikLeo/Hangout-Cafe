<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#ba4a00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Plate -->
            <ellipse cx="0" cy="10" rx="65" ry="25" fill="#f2f4f4"/>
            <ellipse cx="0" cy="8" rx="58" ry="20" fill="#eaeded"/>
            <!-- Mound of Basmati Biryani -->
            <path d="M-48,5 C-45,-25 45,-25 48,5 Z" fill="#f39c12"/>
            <!-- Saffron yellow & orange grains -->
            <circle cx="-20" cy="-10" r="12" fill="#e67e22"/>
            <circle cx="15" cy="-8" r="14" fill="#f1c40f"/>
            <circle cx="-2" cy="-16" r="10" fill="#d35400"/>
            <!-- Juicy Chicken Piece on top -->
            <path d="M-8,-25 C5,-35 22,-20 15,-8 C5,-10 -5,-15 -8,-25 Z" fill="#a93226"/>
            <!-- Boiled Egg Half & Mint -->
            <ellipse cx="-22" cy="-2" rx="10" ry="7" fill="#fdfefe"/>
            <ellipse cx="-22" cy="-2" rx="6" ry="4" fill="#f4d03f"/>
            <circle cx="2" cy="0" r="4" fill="#27ae60"/>
            <line x1="-5" y1="-5" x2="8" y2="3" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#fef9e7" text-anchor="middle" letter-spacing="0.3">Special Chicken Biryani</text>
  </g>
</svg>