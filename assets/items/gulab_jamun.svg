<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e2c00"/>
      <stop offset="100%" stop-color="#3e1800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Dessert Bowl with Syrup -->
            <ellipse cx="0" cy="10" rx="50" ry="20" fill="#fdfefe"/>
            <ellipse cx="0" cy="8" rx="42" ry="15" fill="#f39c12"/>
            <!-- Two Brown Sweet Balls -->
            <circle cx="-14" cy="-4" r="16" fill="#4a235a"/>
            <circle cx="14" cy="-2" r="16" fill="#5b2c10"/>
            <!-- Pistachio Garnish -->
            <circle cx="-16" cy="-10" r="2" fill="#27ae60"/>
            <circle cx="12" cy="-8" r="2" fill="#2ecc71"/>
            <circle cx="0" cy="2" r="2" fill="#27ae60"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Gulab Jamun (2 pcs)</text>
  </g>
</svg>