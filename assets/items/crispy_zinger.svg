<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7950b"/>
      <stop offset="100%" stop-color="#7d6608"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Top Bun -->
            <path d="M-42,-8 C-42,-35 42,-35 42,-8 Z" fill="#d35400"/>
            <!-- Sesame seeds -->
            <circle cx="-15" cy="-22" r="1.5" fill="#fcf3cf"/>
            <circle cx="10" cy="-24" r="1.5" fill="#fcf3cf"/>
            <circle cx="0" cy="-16" r="1.5" fill="#fcf3cf"/>
            <!-- Sauce / Mayo -->
            <path d="M-38,-6 Q0,2 38,-6" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
            <!-- Crisp Fried Chicken Patty -->
            <path d="M-44,2 Q-20,-4 0,3 Q20,-4 44,2 Q20,10 0,6 Q-20,10 -44,2 Z" fill="#ba4a00"/>
            <!-- Lettuce -->
            <path d="M-40,8 Q-30,16 -20,8 Q-10,16 0,8 Q10,16 20,8 Q30,16 40,8" fill="#27ae60" stroke="#2ecc71" stroke-width="2"/>
            <!-- Cheese Slice -->
            <polygon points="-38,12 38,12 25,20 -25,20" fill="#f4d03f"/>
            <!-- Bottom Bun -->
            <path d="M-40,16 C-40,28 40,28 40,16 Z" fill="#d35400"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Crispy Zinger Burger</text>
  </g>
</svg>