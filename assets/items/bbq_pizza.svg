<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e2c00"/>
      <stop offset="100%" stop-color="#3e1800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <circle cx="0" cy="0" r="48" fill="#ba4a00"/>
            <circle cx="0" cy="0" r="42" fill="#f39c12"/>
            <!-- BBQ Swirl -->
            <path d="M-30,-15 Q0,-30 30,-5 Q-10,25 20,30" fill="none" stroke="#641e16" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="-15" cy="-8" r="6" fill="#78281f"/>
            <circle cx="15" cy="-18" r="6" fill="#78281f"/>
            <circle cx="0" cy="12" r="7" fill="#78281f"/>
            <!-- Red Onions -->
            <circle cx="-10" cy="18" r="5" fill="none" stroke="#a569bd" stroke-width="2"/>
            <circle cx="16" cy="4" r="5" fill="none" stroke="#a569bd" stroke-width="2"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f5b041" text-anchor="middle" letter-spacing="0.3">BBQ Chicken Pizza (M)</text>
  </g>
</svg>