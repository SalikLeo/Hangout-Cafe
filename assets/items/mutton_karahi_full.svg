<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#922b21"/>
      <stop offset="100%" stop-color="#641e16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <ellipse cx="0" cy="0" rx="64" ry="32" fill="#1b2631"/>
            <ellipse cx="0" cy="-3" rx="58" ry="28" fill="#78281f"/>
            <ellipse cx="0" cy="-2" rx="50" ry="22" fill="#922b21"/>
            <circle cx="-18" cy="-4" r="14" fill="#a04000"/>
            <circle cx="18" cy="-5" r="13" fill="#6e2c00"/>
            <circle cx="0" cy="4" r="12" fill="#873600"/>
            <circle cx="-2" cy="-10" r="11" fill="#b9770e"/>
            <!-- Bone Accent -->
            <rect x="-6" y="-12" width="12" height="6" rx="3" fill="#fdfefe"/>
            <!-- Garnish -->
            <line x1="-14" y1="-8" x2="14" y2="4" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
            <line x1="-6" y1="6" x2="12" y2="-8" stroke="#f1c40f" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Handles -->
            <path d="M-64,-2 C-76,-15 -76,15 -64,2" fill="none" stroke="#bdc3c7" stroke-width="5" stroke-linecap="round"/>
            <path d="M64,-2 C76,-15 76,15 64,2" fill="none" stroke="#bdc3c7" stroke-width="5" stroke-linecap="round"/>
            <path d="M-10,-35 Q-5,-48 -10,-60" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path d="M8,-38 Q14,-50 8,-62" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Mutton Karahi Full</text>
  </g>
</svg>