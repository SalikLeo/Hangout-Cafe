<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2874a6"/>
      <stop offset="100%" stop-color="#1b4f72"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <ellipse cx="0" cy="10" rx="65" ry="25" fill="#f2f4f4"/>
            <path d="M-48,5 C-45,-25 45,-25 48,5 Z" fill="#f9e79f"/>
            <!-- Shredded Chicken & Veggies -->
            <rect x="-18" y="-12" width="12" height="5" rx="2" fill="#e67e22"/>
            <rect x="6" y="-16" width="14" height="5" rx="2" fill="#e67e22"/>
            <rect x="-5" y="-5" width="10" height="5" rx="2" fill="#e67e22"/>
            <circle cx="16" cy="-4" r="3.5" fill="#27ae60"/>
            <circle cx="-12" cy="-2" r="3" fill="#e74c3c"/>
            <circle cx="2" cy="-14" r="4" fill="#f4d03f"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#fcf3cf" text-anchor="middle" letter-spacing="0.3">Chicken Fried Rice</text>
  </g>
</svg>