<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#196f3d"/>
      <stop offset="100%" stop-color="#114b28"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Tortilla wrap diagonal cut -->
            <path d="M-40,20 L10,-35 L45,-15 L-5,40 Z" fill="#f8c471"/>
            <!-- Grill lines on tortilla -->
            <line x1="-30" y1="10" x2="-10" y2="-20" stroke="#b9770e" stroke-width="3"/>
            <line x1="-15" y1="25" x2="5" y2="-5" stroke="#b9770e" stroke-width="3"/>
            <!-- Open cross section showing filling -->
            <ellipse cx="27" cy="-25" rx="18" ry="10" transform="rotate(-40 27 -25)" fill="#ba4a00"/>
            <circle cx="24" cy="-28" r="4" fill="#27ae60"/>
            <circle cx="30" cy="-22" r="4" fill="#e74c3c"/>
            <circle cx="28" cy="-27" r="3" fill="#ffffff"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Grilled Chicken Wrap</text>
  </g>
</svg>