<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a93226"/>
      <stop offset="100%" stop-color="#641e16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <ellipse cx="0" cy="5" rx="55" ry="26" fill="#fdfefe"/>
            <ellipse cx="0" cy="3" rx="46" ry="20" fill="#c0392b"/>
            <!-- Penne tubes -->
            <rect x="-25" y="-8" width="16" height="7" rx="2" transform="rotate(-20)" fill="#f39c12"/>
            <rect x="-5" y="-14" width="16" height="7" rx="2" transform="rotate(15)" fill="#f39c12"/>
            <rect x="12" y="-6" width="16" height="7" rx="2" transform="rotate(-30)" fill="#f39c12"/>
            <rect x="-10" y="2" width="16" height="7" rx="2" transform="rotate(5)" fill="#f39c12"/>
            <!-- Chili specks & Basil -->
            <circle cx="-18" cy="2" r="2" fill="#78281f"/>
            <circle cx="4" cy="-2" r="3" fill="#27ae60"/>
            <circle cx="20" cy="4" r="2" fill="#78281f"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Spicy Penne Arrabbiata</text>
  </g>
</svg>