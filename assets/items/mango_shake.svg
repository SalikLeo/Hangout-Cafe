<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d68910"/>
      <stop offset="100%" stop-color="#935116"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <path d="M-24,-30 L24,-30 L16,35 L-16,35 Z" fill="none" stroke="#fdebd0" stroke-width="3"/>
            <path d="M-22,-26 L22,-26 L15,32 L-15,32 Z" fill="#f39c12"/>
            <!-- Cream Top -->
            <ellipse cx="0" cy="-26" rx="22" ry="8" fill="#fdfefe"/>
            <!-- Mango Cubes on top -->
            <rect x="-8" y="-35" width="8" height="7" rx="1" fill="#f5b041"/>
            <rect x="2" y="-34" width="7" height="6" rx="1" fill="#f5b041"/>
            <!-- Straw -->
            <line x1="5" y1="25" x2="22" y2="-55" stroke="#3498db" stroke-width="4" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Mango Milkshake</text>
  </g>
</svg>