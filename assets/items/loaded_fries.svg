<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af601a"/>
      <stop offset="100%" stop-color="#6e2c00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Fries in basket -->
            <rect x="-35" y="-20" width="8" height="42" rx="4" transform="rotate(-15)" fill="#f4d03f"/>
            <rect x="-18" y="-25" width="8" height="46" rx="4" transform="rotate(-5)" fill="#f5b041"/>
            <rect x="2" y="-28" width="8" height="48" rx="4" transform="rotate(8)" fill="#f4d03f"/>
            <rect x="20" y="-22" width="8" height="44" rx="4" transform="rotate(18)" fill="#f5b041"/>
            <!-- Melted Cheese Blanket -->
            <path d="M-40,0 Q0,-15 40,0 Q25,18 0,14 Q-25,18 -40,0 Z" fill="#f1c40f" opacity="0.95"/>
            <!-- Jalapenos & Beef bacon bits -->
            <circle cx="-14" cy="5" r="4" fill="#27ae60"/>
            <circle cx="12" cy="4" r="4" fill="#27ae60"/>
            <rect x="-4" y="2" width="6" height="4" rx="1" fill="#922b21"/>
            <rect x="20" y="6" width="6" height="4" rx="1" fill="#922b21"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Loaded Cheese Fries</text>
  </g>
</svg>