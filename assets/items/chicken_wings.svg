<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a93226"/>
      <stop offset="100%" stop-color="#641e16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Glazed BBQ wings -->
            <path d="M-35,10 C-45,-10 -15,-30 10,-10 C5,10 -15,20 -35,10 Z" fill="#ba4a00"/>
            <path d="M-5,18 C-15,0 15,-20 35,0 C30,20 10,28 -5,18 Z" fill="#922b21"/>
            <!-- Sesame sprinkle -->
            <circle cx="-20" cy="-5" r="1.5" fill="#ffffff"/>
            <circle cx="15" cy="5" r="1.5" fill="#ffffff"/>
            <circle cx="5" cy="-8" r="1.5" fill="#ffffff"/>
            <!-- Dip cup -->
            <ellipse cx="-25" cy="22" rx="14" ry="7" fill="#ffffff"/>
            <ellipse cx="-25" cy="22" rx="11" ry="5" fill="#c0392b"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Crispy Wings (6 pcs)</text>
  </g>
</svg>