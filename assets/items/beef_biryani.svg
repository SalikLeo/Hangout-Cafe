<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#922b21"/>
      <stop offset="100%" stop-color="#78281f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <ellipse cx="0" cy="10" rx="65" ry="25" fill="#f2f4f4"/>
            <ellipse cx="0" cy="8" rx="58" ry="20" fill="#eaeded"/>
            <path d="M-48,5 C-45,-25 45,-25 48,5 Z" fill="#e67e22"/>
            <!-- Beef boti -->
            <circle cx="-16" cy="-12" r="12" fill="#6e2c00"/>
            <circle cx="18" cy="-10" r="11" fill="#78281f"/>
            <circle cx="0" cy="-18" r="13" fill="#d35400"/>
            <!-- Potato chunk (Aloo) -->
            <circle cx="12" cy="0" r="9" fill="#f39c12"/>
            <circle cx="-10" cy="2" r="3.5" fill="#27ae60"/>
            <line x1="2" y1="-8" x2="16" y2="0" stroke="#f1c40f" stroke-width="2.5"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Beef Degi Biryani</text>
  </g>
</svg>