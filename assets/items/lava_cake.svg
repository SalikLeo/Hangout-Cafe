<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Chocolate Cake Bundt -->
            <path d="M-35,15 L-20,-20 L20,-20 L35,15 Z" fill="#341f11"/>
            <!-- Melted Lava core oozing -->
            <ellipse cx="0" cy="-20" rx="20" ry="8" fill="#1c0f08"/>
            <path d="M-8,-16 Q0,10 12,20" stroke="#1c0f08" stroke-width="6" fill="none" stroke-linecap="round"/>
            <!-- Vanilla Ice Cream Scoop on Side -->
            <circle cx="26" cy="5" r="14" fill="#fdfefe"/>
            <circle cx="-2" cy="-28" r="5" fill="#e74c3c"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Molten Lava Cake</text>
  </g>
</svg>