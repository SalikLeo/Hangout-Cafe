<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#b03a2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Karahi Wok -->
            <ellipse cx="0" cy="0" rx="62" ry="32" fill="#2c3e50"/>
            <ellipse cx="0" cy="-3" rx="56" ry="28" fill="#d35400"/>
            <!-- Rich Gravy & Chicken -->
            <ellipse cx="0" cy="-2" rx="48" ry="22" fill="#c0392b"/>
            <circle cx="-16" cy="-4" r="14" fill="#e67e22"/>
            <circle cx="16" cy="-6" r="13" fill="#d35400"/>
            <circle cx="2" cy="4" r="12" fill="#e67e22"/>
            <circle cx="-2" cy="-10" r="11" fill="#f39c12"/>
            <!-- Ginger & Coriander Garnish -->
            <line x1="-12" y1="-8" x2="12" y2="2" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
            <line x1="-5" y1="6" x2="15" y2="-4" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="-8" y1="-2" x2="6" y2="-12" stroke="#fff9c4" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Handles -->
            <path d="M-62,-2 C-74,-15 -74,15 -62,2" fill="none" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round"/>
            <path d="M62,-2 C74,-15 74,15 62,2" fill="none" stroke="#7f8c8d" stroke-width="5" stroke-linecap="round"/>
            <!-- Steam -->
            <path d="M-15,-35 Q-10,-48 -15,-60" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
            <path d="M5,-38 Q12,-52 5,-65" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffeb3b" text-anchor="middle" letter-spacing="0.3">Chicken Karahi Full</text>
  </g>
</svg>