<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#ba4a00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <ellipse cx="0" cy="0" rx="52" ry="26" fill="#2c3e50"/>
            <ellipse cx="0" cy="-3" rx="46" ry="22" fill="#d35400"/>
            <ellipse cx="0" cy="-2" rx="40" ry="18" fill="#e74c3c"/>
            <circle cx="-12" cy="-3" r="11" fill="#f39c12"/>
            <circle cx="12" cy="-4" r="10" fill="#d35400"/>
            <circle cx="0" cy="2" r="9" fill="#e67e22"/>
            <!-- Garnish -->
            <line x1="-8" y1="-5" x2="10" y2="3" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="-4" y1="4" x2="8" y2="-6" stroke="#fff9c4" stroke-width="2" stroke-linecap="round"/>
            <!-- Handles -->
            <path d="M-52,-2 C-62,-12 -62,12 -52,2" fill="none" stroke="#7f8c8d" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M52,-2 C62,-12 62,12 52,2" fill="none" stroke="#7f8c8d" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M0,-30 Q6,-42 0,-54" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#fff9c4" text-anchor="middle" letter-spacing="0.3">Chicken Karahi Half</text>
  </g>
</svg>