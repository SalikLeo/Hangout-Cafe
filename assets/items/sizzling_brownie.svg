<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a235a"/>
      <stop offset="100%" stop-color="#1b2631"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Cast iron sizzling pan -->
            <ellipse cx="0" cy="12" rx="55" ry="22" fill="#17202a"/>
            <!-- Square brownie block -->
            <rect x="-22" y="-12" width="44" height="20" rx="3" fill="#3e2723"/>
            <!-- Scoop of Ice cream -->
            <circle cx="0" cy="-18" r="14" fill="#fdfefe"/>
            <!-- Hot chocolate fudge drizzle -->
            <path d="M-8,-26 Q0,-10 8,-26" stroke="#211510" stroke-width="3" fill="none"/>
            <path d="M-15,-32 Q-8,-44 -15,-55" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Sizzling Brownie with Ice Cream</text>
  </g>
</svg>