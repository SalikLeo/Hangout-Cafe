<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78281f"/>
      <stop offset="100%" stop-color="#4a154b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Skewered Kababs -->
            <rect x="-48" y="-12" width="96" height="14" rx="7" transform="rotate(-15)" fill="#6e2c00"/>
            <rect x="-48" y="4" width="96" height="14" rx="7" transform="rotate(-15)" fill="#7e5109"/>
            <!-- Char marks -->
            <line x1="-30" y1="-18" x2="-26" y2="-4" stroke="#1b2631" stroke-width="3" stroke-linecap="round"/>
            <line x1="-5" y1="-12" x2="-1" y2="2" stroke="#1b2631" stroke-width="3" stroke-linecap="round"/>
            <line x1="20" y1="-6" x2="24" y2="8" stroke="#1b2631" stroke-width="3" stroke-linecap="round"/>
            <!-- Onion Rings & Mint -->
            <circle cx="-15" cy="22" r="8" fill="none" stroke="#fdfefe" stroke-width="2.5"/>
            <circle cx="10" cy="20" r="7" fill="none" stroke="#fdfefe" stroke-width="2.5"/>
            <circle cx="0" cy="24" r="4" fill="#27ae60"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Beef Seekh Kabab</text>
  </g>
</svg>