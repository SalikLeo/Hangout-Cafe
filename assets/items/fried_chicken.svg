<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9770e"/>
      <stop offset="100%" stop-color="#78281f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Drumstick 1 -->
            <path d="M-30,5 C-45,-15 -25,-35 0,-25 C10,-10 0,15 -30,5 Z" fill="#b9770e"/>
            <circle cx="12" cy="-10" r="6" fill="#fdfefe"/>
            <!-- Drumstick 2 -->
            <path d="M-5,15 C-20,-5 0,-25 25,-15 C35,0 25,25 -5,15 Z" fill="#d35400"/>
            <circle cx="36" cy="0" r="6" fill="#fdfefe"/>
            <!-- Crispy Texture -->
            <circle cx="-18" cy="-15" r="2" fill="#7e5109"/>
            <circle cx="10" cy="-5" r="2.5" fill="#7e5109"/>
            <circle cx="8" cy="12" r="2" fill="#7e5109"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Crispy Fried Chicken (3 pcs)</text>
  </g>
</svg>