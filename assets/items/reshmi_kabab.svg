<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9770e"/>
      <stop offset="100%" stop-color="#7e5109"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <rect x="-48" y="-10" width="96" height="15" rx="7.5" transform="rotate(-15)" fill="#f39c12"/>
            <rect x="-48" y="6" width="96" height="15" rx="7.5" transform="rotate(-15)" fill="#e67e22"/>
            <line x1="-28" y1="-14" x2="-24" y2="-1" stroke="#935116" stroke-width="3" stroke-linecap="round"/>
            <line x1="-3" y1="-7" x2="1" y2="6" stroke="#935116" stroke-width="3" stroke-linecap="round"/>
            <line x1="22" y1="-1" x2="26" y2="12" stroke="#935116" stroke-width="3" stroke-linecap="round"/>
            <!-- Herbs -->
            <circle cx="-2" cy="18" r="3" fill="#27ae60"/>
            <circle cx="16" cy="16" r="3" fill="#2ecc71"/>
            <path d="M0,-25 Q5,-38 0,-50" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Chicken Reshmi Kabab</text>
  </g>
</svg>