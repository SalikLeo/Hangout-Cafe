<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#922b21"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Pizza Slice / Round Pan -->
            <circle cx="0" cy="0" r="48" fill="#d35400"/>
            <circle cx="0" cy="0" r="42" fill="#f4d03f"/>
            <!-- Fajita Chicken & Bell peppers -->
            <rect x="-18" y="-18" width="10" height="6" rx="2" fill="#922b21"/>
            <rect x="10" y="-15" width="10" height="6" rx="2" fill="#922b21"/>
            <rect x="-8" y="10" width="11" height="6" rx="2" fill="#922b21"/>
            <path d="M-15,5 Q-5,0 -5,12" stroke="#27ae60" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M8,4 Q18,8 14,20" stroke="#27ae60" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <circle cx="0" cy="-22" r="3" fill="#1b2631"/>
            <circle cx="-25" cy="-2" r="3" fill="#1b2631"/>
            <circle cx="22" cy="-4" r="3" fill="#1b2631"/>
            <!-- Cut lines -->
            <line x1="-42" y1="0" x2="42" y2="0" stroke="#d68910" stroke-width="1.5" stroke-dasharray="3,3"/>
            <line x1="0" y1="-42" x2="0" y2="42" stroke="#d68910" stroke-width="1.5" stroke-dasharray="3,3"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Chicken Fajita Pizza (L)</text>
  </g>
</svg>