<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7950b"/>
      <stop offset="100%" stop-color="#7d6608"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Teardrop / oval Naan shape -->
            <path d="M0,-46 C32,-30 45,15 25,38 C0,50 -25,38 -45,15 C-32,-30 0,-46 0,-46 Z" fill="#f5b041"/>
            <path d="M0,-42 C28,-28 38,12 20,34 C0,44 -20,34 -38,12 C-28,-28 0,-42 0,-42 Z" fill="#f8c471"/>
            <!-- Naan dimples -->
            <circle cx="-10" cy="-10" r="3" fill="#b9770e"/>
            <circle cx="10" cy="-8" r="3.5" fill="#b9770e"/>
            <circle cx="0" cy="12" r="3.5" fill="#b9770e"/>
            <!-- Sesame seeds -->
            <circle cx="-18" cy="2" r="1.5" fill="#ffffff"/>
            <circle cx="16" cy="18" r="1.5" fill="#ffffff"/>
            <circle cx="-4" cy="-22" r="1.5" fill="#ffffff"/>
            <circle cx="12" cy="-24" r="1.5" fill="#ffffff"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Roghni Naan (Sesame)</text>
  </g>
</svg>