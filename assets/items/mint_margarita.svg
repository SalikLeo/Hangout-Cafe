<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#117864"/>
      <stop offset="100%" stop-color="#0b5345"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Margarita Glass -->
            <path d="M-32,-25 L32,-25 L12,5 L4,5 L4,32 L20,32 L20,38 L-20,38 L-20,32 L-4,32 L-4,5 L-12,5 Z" fill="none" stroke="#d0ece7" stroke-width="3"/>
            <!-- Vibrant Green Slush -->
            <path d="M-28,-22 L28,-22 L10,3 L-10,3 Z" fill="#2ecc71"/>
            <!-- Lemon Slice on Rim -->
            <circle cx="26" cy="-25" r="10" fill="#f4d03f"/>
            <!-- Mint Sprig -->
            <path d="M-6,-22 C-14,-35 -4,-38 0,-25" fill="#145a32"/>
            <path d="M0,-25 C8,-38 18,-35 6,-22" fill="#196f3d"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#a3e4d7" text-anchor="middle" letter-spacing="0.3">Mint Margarita</text>
  </g>
</svg>