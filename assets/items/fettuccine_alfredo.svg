<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e4053"/>
      <stop offset="100%" stop-color="#1c2833"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Pasta Bowl -->
            <ellipse cx="0" cy="5" rx="55" ry="26" fill="#fdfefe"/>
            <ellipse cx="0" cy="3" rx="46" ry="20" fill="#fcf3cf"/>
            <!-- Pasta Ribbon Swirls -->
            <path d="M-30,-2 Q-10,-18 10,-2 Q30,-18 35,-2" fill="none" stroke="#f9e79f" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M-25,6 Q0,-8 25,6" fill="none" stroke="#fdfefe" stroke-width="4" stroke-linecap="round"/>
            <path d="M-15,-8 Q5,4 20,-8" fill="none" stroke="#f9e79f" stroke-width="3.5" stroke-linecap="round"/>
            <!-- Grilled Chicken Slices on top -->
            <rect x="-16" y="-14" width="14" height="6" rx="2" fill="#d35400"/>
            <rect x="4" y="-12" width="14" height="6" rx="2" fill="#d35400"/>
            <!-- Black Pepper & Parsley -->
            <circle cx="-5" cy="-2" r="1.5" fill="#2c3e50"/>
            <circle cx="10" cy="2" r="1.5" fill="#27ae60"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Creamy Fettuccine Alfredo</text>
  </g>
</svg>