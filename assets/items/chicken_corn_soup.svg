<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7950b"/>
      <stop offset="100%" stop-color="#7d6608"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <path d="M-45,-5 C-45,28 45,28 45,-5 Z" fill="#d4ac0d"/>
            <ellipse cx="0" cy="-5" rx="45" ry="14" fill="#f7dc6f"/>
            <!-- Corn kernels & egg drop ribbons -->
            <circle cx="-18" cy="-5" r="3" fill="#f39c12"/>
            <circle cx="6" cy="-7" r="3" fill="#f39c12"/>
            <circle cx="20" cy="-3" r="3" fill="#f39c12"/>
            <circle cx="-6" cy="-3" r="3" fill="#f39c12"/>
            <path d="M-28,-6 Q-5,0 22,-6" stroke="#ffffff" stroke-width="3" fill="none"/>
            <path d="M0,-24 Q6,-38 0,-50" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Chicken Corn Soup</text>
  </g>
</svg>