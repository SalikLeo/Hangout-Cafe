<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7950b"/>
      <stop offset="100%" stop-color="#7d6608"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Clay Matka/Bowl -->
            <ellipse cx="0" cy="8" rx="48" ry="20" fill="#b9770e"/>
            <ellipse cx="0" cy="5" rx="42" ry="16" fill="#fef9e7"/>
            <!-- Silver Leaf (Chandi Warq) & Saffron -->
            <polygon points="-12,-2 -2,-8 6,-2 -4,4" fill="#d5d8dc"/>
            <line x1="-20" y1="6" x2="-10" y2="4" stroke="#c0392b" stroke-width="2"/>
            <circle cx="16" cy="4" r="2.5" fill="#27ae60"/>
            <circle cx="8" cy="8" r="2" fill="#e67e22"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Shahi Kheer Bowl</text>
  </g>
</svg>