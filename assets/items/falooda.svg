<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#884ea0"/>
      <stop offset="100%" stop-color="#512e5f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <ellipse cx="0" cy="12" rx="50" ry="22" fill="#fdfefe"/>
            <!-- Rose Syrup & Sev Vermicelli -->
            <ellipse cx="0" cy="9" rx="44" ry="17" fill="#e91e63"/>
            <!-- Kulfa Kulfi Slices -->
            <rect x="-18" y="-12" width="16" height="12" rx="3" fill="#f9e79f"/>
            <rect x="4" y="-14" width="16" height="12" rx="3" fill="#f9e79f"/>
            <!-- Basil seeds (Tukh malanga) & Jelly -->
            <circle cx="-6" cy="2" r="2.5" fill="#17202a"/>
            <circle cx="2" cy="0" r="2.5" fill="#17202a"/>
            <rect x="-24" y="-2" width="7" height="7" rx="1" fill="#2ecc71"/>
            <rect x="18" y="-2" width="7" height="7" rx="1" fill="#e74c3c"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Special Kulfa Falooda</text>
  </g>
</svg>