<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#935116"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="240" height="240" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="210" cy="30" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="220" r="50" fill="#000000" opacity="0.08"/>
  
  <!-- Center Visual Icon / Illustration -->
  <g filter="url(#shadow)" transform="translate(120, 100)">
    
            <!-- Sizzling Skewer / Chicken Quarter Piece -->
            <path d="M-35,15 Q-15,-30 25,-15 Q40,15 10,25 Q-20,30 -35,15 Z" fill="#c0392b"/>
            <!-- Charred BBQ Marks -->
            <path d="M-22,-2 L-10,-12 M-5,8 L10,-4 M12,18 L26,4" stroke="#4a154b" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="-15" cy="5" r="3" fill="#e67e22"/>
            <circle cx="5" cy="-8" r="3.5" fill="#f39c12"/>
            <!-- Lemon Wedge -->
            <path d="M22,12 A12,12 0 0,0 38,24 L22,24 Z" fill="#f4d03f"/>
            <line x1="-50" y1="25" x2="45" y2="-25" stroke="#7f8c8d" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="-52" cy="27" r="4" fill="#95a5a6"/>
            <!-- Heat Smoke -->
            <path d="M-10,-35 Q-5,-48 -12,-60" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>
  
  <!-- Bottom Plate / Pill Header -->
  <g transform="translate(120, 195)">
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(0,0,0,0.35)" backdrop-filter="blur(4px)"/>
    <text x="0" y="4" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#f9e79f" text-anchor="middle" letter-spacing="0.3">Chicken Tikka Grill</text>
  </g>
</svg>